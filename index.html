<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ALGO-GATE"/>
<meta name="theme-color" content="#050d18"/>
<title>ALGO-GATE · Trading Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#050d18;--bg2:#080f1e;--bg3:#0c1628;--bg4:#101d30;--border:#1a2d4a;--border2:#243d60;--text:#c8ddf5;--text2:#6b8bb5;--text3:#3a5a8a;--green:#00e5a0;--yellow:#f5c842;--red:#ff4466;--blue:#2979ff;--cyan:#00d4ff;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'JetBrains Mono',monospace;color:var(--text);display:flex;flex-direction:column;}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px 10px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top,12px);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--cyan);}
.logo-sub{font-size:8px;color:var(--text3);letter-spacing:2px;margin-top:1px;}
.clock{font-size:10px;color:var(--cyan);text-align:right;}
.clock-label{font-size:8px;color:var(--text3);}
.key-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;}
.key-bar input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 10px;border-radius:6px;outline:none;-webkit-appearance:none;}
.key-bar input.error{border-color:var(--red);}
.key-bar input.ok{border-color:var(--green);}
.key-bar button{background:var(--blue);border:none;color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.key-status{font-size:9px;letter-spacing:1px;}
.key-status.ok{color:var(--green);}
.key-status.err{color:var(--red);}
.tickers-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;flex-shrink:0;}
.ticker-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer;}
.chip.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,0.08);}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.chip .dot.scanning{background:var(--yellow);animation:pulse 0.8s infinite;}
.chip .dot.done{background:var(--green);}
.chip .dot.error{background:var(--red);}
.chip .x{color:var(--text3);font-size:10px;margin-left:2px;}
.add-row{display:flex;gap:6px;}
.add-row input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 10px;border-radius:6px;outline:none;text-transform:uppercase;-webkit-appearance:none;}
.add-row button{background:var(--bg3);border:1px solid var(--border2);color:var(--cyan);font-size:18px;font-weight:700;width:36px;height:36px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.quick-add{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.pop{font-size:10px;padding:3px 8px;border-radius:10px;border:1px dashed var(--border2);color:var(--text2);cursor:pointer;background:transparent;font-family:'JetBrains Mono',monospace;}
.scan-wrap{padding:10px 16px;flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);}
.scan-btn{width:100%;background:linear-gradient(135deg,#1a4fd4,#2979ff);border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;padding:12px;border-radius:10px;cursor:pointer;}
.scan-btn:disabled{opacity:0.4;cursor:not-allowed;}
.scan-btn.scanning{background:linear-gradient(135deg,#0a2040,#0a3060);animation:scanpulse 1.5s infinite;}
.scan-btn.needs-key{background:#0c1628;border:1px solid var(--red);color:var(--red);}
.summary{display:flex;gap:6px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.sum-pill{flex:1;padding:6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:1px;}
.sum-pill .cnt{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.sum-pill .lbl{font-size:8px;letter-spacing:1px;font-weight:700;}
.pill-buy{background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.3);color:var(--green);}
.pill-wait{background:rgba(245,200,66,0.1);border:1px solid rgba(245,200,66,0.3);color:var(--yellow);}
.pill-no{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.3);color:var(--red);}
.results{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.results::-webkit-scrollbar{display:none;}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:10px;padding:40px;}
.empty-icon{font-size:48px;opacity:0.2;}
.empty-title{font-size:13px;letter-spacing:3px;}
.empty-sub{font-size:10px;opacity:0.6;text-align:center;}
.empty-link{font-size:11px;color:var(--blue);border:1px solid rgba(41,121,255,0.3);padding:8px 16px;border-radius:8px;text-decoration:none;margin-top:4px;}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:fadein 0.3s ease;}
.card.buy{border-left:4px solid var(--green);}
.card.wait{border-left:4px solid var(--yellow);}
.card.notrade{border-left:4px solid var(--red);opacity:0.8;}
.card.error-card{padding:12px 14px;display:flex;align-items:center;gap:10px;}
.card-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--border);}
.card-ticker{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;line-height:1;}
.card-badge{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;padding:3px 9px;border-radius:6px;}
.badge-buy{background:rgba(0,229,160,0.15);color:var(--green);border:1px solid rgba(0,229,160,0.4);}
.badge-wait{background:rgba(245,200,66,0.15);color:var(--yellow);border:1px solid rgba(245,200,66,0.4);}
.badge-no{background:rgba(255,68,102,0.15);color:var(--red);border:1px solid rgba(255,68,102,0.4);}
.stars{display:flex;gap:2px;margin-left:2px;}
.star{font-size:11px;}
.rr-wrap{margin-left:auto;text-align:right;}
.rr-label{font-size:8px;color:var(--text3);letter-spacing:1px;}
.rr-val{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;}
.rr-green{color:var(--green);}.rr-yellow{color:var(--yellow);}.rr-red{color:var(--red);}
.card-body{padding:10px 14px;display:flex;flex-direction:column;gap:10px;}
.gates-row{display:flex;justify-content:space-around;}
.gate-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
.gate-dot{width:12px;height:12px;border-radius:50%;}
.gate-dot.pass{background:var(--green);box-shadow:0 0 6px var(--green);}
.gate-dot.fail{background:var(--red);box-shadow:0 0 6px var(--red);}
.gate-dot.idle{background:var(--border);}
.gate-name{font-size:8px;color:var(--text3);letter-spacing:1px;}
.price-bar-wrap{background:var(--bg4);border-radius:8px;padding:10px;}
.price-bar-label{font-size:8px;color:var(--text3);letter-spacing:1px;margin-bottom:8px;}
.price-track{position:relative;height:6px;background:var(--border);border-radius:3px;margin:0 6px;}
.price-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green));}
.price-marker{position:absolute;top:-5px;width:2px;height:16px;border-radius:1px;transform:translateX(-50%);}
.price-levels{display:flex;justify-content:space-between;margin-top:8px;}
.level{display:flex;flex-direction:column;align-items:center;}
.level-lbl{font-size:7px;color:var(--text3);letter-spacing:1px;}
.level-val{font-size:11px;font-weight:700;}
.meta-row{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.meta-item{flex:1;padding:6px 4px;text-align:center;border-right:1px solid var(--border);}
.meta-item:last-child{border-right:none;}
.meta-lbl{font-size:7px;color:var(--text3);letter-spacing:1px;}
.meta-val{font-size:11px;font-weight:700;margin-top:1px;}
.advisor{background:rgba(41,121,255,0.06);border:1px solid rgba(41,121,255,0.2);border-radius:8px;padding:10px;}
.advisor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.advisor-title{font-size:8px;color:var(--blue);letter-spacing:1px;}
.timing{font-size:8px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1px;}
.t-enter{background:rgba(0,229,160,0.2);color:var(--green);}
.t-pullback{background:rgba(245,200,66,0.2);color:var(--yellow);}
.t-breakout{background:rgba(41,121,255,0.2);color:#5599ff;}
.t-avoid{background:rgba(255,68,102,0.2);color:var(--red);}
.advisor-text{font-size:11px;color:var(--text);line-height:1.55;}
.warning{font-size:10px;color:#c9a030;margin-top:4px;}
.scan-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
.scan-ticker-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--cyan);letter-spacing:2px;}
.scan-ticker-sub{font-size:9px;color:var(--text3);margin-top:2px;}
.chart-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(41,121,255,0.08);border:1px solid rgba(41,121,255,0.25);border-radius:8px;padding:8px;color:#5599ff;font-size:11px;font-weight:600;text-decoration:none;letter-spacing:1px;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes scanpulse{0%,100%{box-shadow:0 0 0 0 rgba(41,121,255,0.4)}50%{box-shadow:0 0 12px 4px rgba(41,121,255,0.2)}}
.results{padding-bottom:calc(10px + env(safe-area-inset-bottom));}
</style>
</head>
<body>
<div class="header">
  <div><div class="logo">ALGO-GATE</div><div class="logo-sub">9-STEP PROTOCOL · RULE-BASED · FREE</div></div>
  <div style="text-align:right">
    <div class="clock-label">SAN DIEGO TIME</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-label" id="marketStatus" style="margin-top:2px"></div>
  </div>
</div>
<div class="key-bar">
  <div style="flex:1">
    <div class="key-status" id="keyStatus">⚠ PASTE FINNHUB KEY</div>
    <div style="display:flex;gap:6px;margin-top:4px">
      <input type="text" id="keyInput" placeholder="finnhub.io/register → free key" class="error"/>
      <button onclick="setKey()">SET</button>
    </div>
  </div>
</div>
<div class="tickers-bar">
  <div class="ticker-row" id="chips"></div>
  <div class="add-row">
    <input type="text" id="addInput" placeholder="ADD TICKER" maxlength="6" onkeydown="if(event.key==='Enter')addTicker()"/>
    <button onclick="addTicker()">+</button>
  </div>
  <div class="quick-add" id="quickAdd"></div>
</div>
<div class="scan-wrap">
  <button class="scan-btn needs-key" id="scanBtn" onclick="startScan()">SET API KEY FIRST</button>
</div>
<div class="summary" id="summary" style="display:none">
  <div class="sum-pill pill-buy"><div class="cnt" id="buyCount">0</div><div class="lbl">BUY</div></div>
  <div class="sum-pill pill-wait"><div class="cnt" id="waitCount">0</div><div class="lbl">WAIT</div></div>
  <div class="sum-pill pill-no"><div class="cnt" id="noCount">0</div><div class="lbl">NO TRADE</div></div>
</div>
<div class="results" id="results">
  <div class="empty" id="emptyState">
    <div class="empty-icon">⬡</div>
    <div class="empty-title">PROTOCOL READY</div>
    <div class="empty-sub">Paste your free Finnhub key above, add tickers, then scan</div>
    <a class="empty-link" href="https://finnhub.io/register" target="_blank">Get Free Key (no card) →</a>
  </div>
</div>
<script>
const POPULAR=['SPY','QQQ','AMD','AAPL','META','GOOGL','NVDA','TSLA','PLTR','ARM','CRWV','SOFI'];
let tickers=['IREN','NVDA','TSLA','SPY','AAPL','AMD'];
let results={},statuses={},scanning=false,apiKey='';
function updateClock(){
  const pt=new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock').textContent=pt+' PT';
  const est=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h=est.getHours(),m=est.getMinutes();
  const isWeekend=est.getDay()===0||est.getDay()===6;
  let status='',color='';
  if(isWeekend){status='⬛ MARKET CLOSED (WEEKEND)';color='#3a5a8a';}
  else if(h<9||(h===9&&m<30)){status='🟡 PRE-MARKET';color='#f5c842';}
  else if(h>=16){status='⬛ MARKET CLOSED';color='#3a5a8a';}
  else if(h===9&&m>=30&&m<45){status='⚠ WAIT — NO TRADE ZONE';color='#f5c842';}
  else{status='🟢 MARKET OPEN';color='#00e5a0';}
  const el=document.getElementById('marketStatus');
  el.textContent=status;el.style.color=color;
}
setInterval(updateClock,1000);updateClock();
function setKey(){
  const k=document.getElementById('keyInput').value.trim();
  if(k.length<8)return;
  apiKey=k;
  document.getElementById('keyInput').className='ok';
  document.getElementById('keyStatus').textContent='✓ FINNHUB CONNECTED';
  document.getElementById('keyStatus').className='key-status ok';
  updateScanBtn();
}
function updateScanBtn(){
  const btn=document.getElementById('scanBtn');
  if(scanning){btn.textContent='◼ SCANNING...';btn.className='scan-btn scanning';btn.disabled=true;}
  else if(!apiKey){btn.textContent='SET API KEY FIRST';btn.className='scan-btn needs-key';btn.disabled=false;}
  else if(tickers.length===0){btn.textContent='ADD TICKERS FIRST';btn.className='scan-btn needs-key';btn.disabled=false;}
  else{btn.textContent='▶ RUN PROTOCOL SCAN';btn.className='scan-btn';btn.disabled=false;}
}
function renderChips(){
  document.getElementById('chips').innerHTML=tickers.map(t=>{
    const st=statuses[t]||'idle';
    return`<div class="chip ${st!=='idle'?'active':''}" onclick="removeTicker('${t}')"><div class="dot ${st}"></div>${t}<span class="x">✕</span></div>`;
  }).join('');
  document.getElementById('quickAdd').innerHTML=POPULAR.filter(p=>!tickers.includes(p)).slice(0,8).map(p=>`<span class="pop" onclick="quickAdd('${p}')">${p}</span>`).join('');
}
function addTicker(){const inp=document.getElementById('addInput');const t=inp.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,6);if(t&&!tickers.includes(t)){tickers.push(t);inp.value='';renderChips();updateScanBtn();}}
function quickAdd(t){if(!tickers.includes(t)){tickers.push(t);renderChips();updateScanBtn();}}
function removeTicker(t){if(scanning)return;tickers=tickers.filter(x=>x!==t);delete results[t];renderChips();renderResults();updateScanBtn();}
async function fhGet(path,params){
  const url=new URL('https://finnhub.io/api/v1'+path);
  url.searchParams.set('token',apiKey);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const r=await fetch(url.toString());
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function fetchAll(symbol){
  const[quote,metric]=await Promise.all([fhGet('/quote',{symbol}),fhGet('/stock/metric',{symbol,metric:'all'})]);
  return{quote,metric:metric.metric||{}};
}
function estimateVWAP(q){if(!q.o||!q.c)return null;return(q.o+q.h+q.l+q.c)/4;}
function estimateATR(q,m){const r=(q.h||q.c)-(q.l||q.c);const w52h=m['52WeekHigh']||q.c*1.3;const w52l=m['52WeekLow']||q.c*0.7;return Math.max(r*0.5,(w52h-w52l)/80*0.6);}
function classifyCandle(o,h,l,c){
  if(!o||!h||!l||!c)return'UNKNOWN';
  const body=Math.abs(c-o),range=h-l;
  if(range<0.0001)return'DOJI';
  const br=body/range,uw=h-Math.max(o,c),lw=Math.min(o,c)-l;
  if(br<0.1)return'DOJI';
  if(c>o&&br>0.65&&c>=h*0.997)return'BREAKOUT CANDLE';
  if(c>o&&br>0.55&&uw<body*0.25)return'STRONG BULLISH';
  if(c>o&&lw>body*1.5&&uw<body*0.4)return'HAMMER';
  if(c>o&&br>0.4)return'ENGULFING';
  if(c<o&&br>0.55)return'BEARISH';
  return'NEUTRAL';
}
function classifySetup(q,vwap,m){
  const c=q.c,o=q.o,w52h=m['52WeekHigh']||c*1.5;
  if(c>w52h*0.98&&c>o)return'BREAKOUT';
  if(vwap&&c>vwap&&o<c&&o<vwap*1.01)return'PULLBACK';
  if(vwap&&c>vwap&&q.l<vwap)return'VWAP RECLAIM';
  return'NONE';
}
async function runProtocol(symbol,spyQuote,spyMetric){
  const{quote:q,metric:m}=await fetchAll(symbol);
  if(!q.c||q.c===0)throw new Error('No price data');
  const price=q.c,open=q.o||price,high=q.h||price,low=q.l||price;
  const changePct=q.dp??((price-(q.pc||price))/(q.pc||price)*100);
  const vwap=estimateVWAP(q),atr=estimateATR(q,m),beta=m['beta']||1;
  const volEst=Math.max(0.3,Math.min(3,((high-low)/(atr*2))*beta));
  const spyPrice=spyQuote?.c??price,spyVwap=spyQuote?estimateVWAP(spyQuote):price,spyPct=spyQuote?.dp??0;
  const regimePass=spyPrice>(spyVwap||spyPrice)&&spyPct>0;
  const sectorPass=changePct>spyPct;
  const candle=classifyCandle(open,high,low,price);
  const candlePass=!['NONE','DOJI','BEARISH','NEUTRAL','UNKNOWN'].includes(candle);
  const setupType=classifySetup(q,vwap,m),setupPass=setupType!=='NONE';
  const w52h=m['52WeekHigh']||high;
  const entryPrice=setupType==='BREAKOUT'?w52h*1.002:vwap?vwap*1.003:price*1.005;
  const stopPrice=entryPrice-1.5*atr,entryPass=price>=entryPrice*0.997;
  const riskPerShare=Math.max(entryPrice-stopPrice,0.01);
  const targetPrice=entryPrice+riskPerShare*(setupType==='BREAKOUT'?3.0:2.5);
  const rr=(targetPrice-entryPrice)/riskPerShare,rrPass=rr>=2.0;
  const gates={regime:regimePass,sector:sectorPass,setup:setupPass&&candlePass,entry:entryPass,risk:rrPass};
  const gc=Object.values(gates).filter(Boolean).length;
  let action,timing,advice,warnings=[];
  if(!regimePass){action='NO TRADE';timing='AVOID TODAY';advice=`SPY below VWAP — RISK_OFF. No longs until SPY reclaims VWAP.`;warnings.push('Market regime failure');}
  else if(gc===5){action='BUY';timing=entryPass?'ENTER NOW':'WAIT FOR BREAKOUT';advice=`${symbol} passes all 5 gates. ${candle} candle, ${setupType} setup. ${changePct>0?'+':''}${changePct.toFixed(2)}% vs SPY ${spyPct.toFixed(2)}%. Entry $${entryPrice.toFixed(2)} → Target $${targetPrice.toFixed(2)} · Stop $${stopPrice.toFixed(2)}.`;if(volEst<0.8)warnings.push('Low volume — reduce size');if(beta>2)warnings.push(`High beta ${beta.toFixed(1)}`);}
  else if(gc>=3){action='WAIT';const failed=Object.entries(gates).filter(([,v])=>!v).map(([k])=>k.toUpperCase());timing=setupPass?'WAIT FOR PULLBACK':'WAIT FOR BREAKOUT';advice=`${symbol} failing: ${failed.join(', ')}. ${vwap?`Watch VWAP $${vwap.toFixed(2)}.`:''}Wait for all 5 gates.`;}
  else{action='NO TRADE';timing='AVOID TODAY';const failed=Object.entries(gates).filter(([,v])=>!v).map(([k])=>k.toUpperCase());advice=`${symbol} fails ${failed.length} gates (${failed.join(', ')}). Hard NO TRADE.`;warnings.push(`${failed.length} gate failures`);}
  let conviction=gc;
  if(volEst>1.4)conviction=Math.min(5,conviction+1);
  if(['BREAKOUT CANDLE','STRONG BULLISH'].includes(candle))conviction=Math.min(5,conviction+1);
  conviction=Math.max(1,Math.min(5,conviction));
  return{ticker:symbol,action,conviction,rr:parseFloat(rr.toFixed(2)),gates,price,entry:parseFloat(entryPrice.toFixed(2)),stop:parseFloat(stopPrice.toFixed(2)),target:parseFloat(targetPrice.toFixed(2)),candle,setup_type:setupType,timing,advice,warnings,meta:{vwap:vwap?parseFloat(vwap.toFixed(2)):null,atr:parseFloat(atr.toFixed(2)),changePct:parseFloat(changePct.toFixed(2)),beta:parseFloat(beta.toFixed(2)),w52h:m['52WeekHigh']||null}};
}
async function startScan(){
  if(!apiKey){alert('Paste your Finnhub key and press SET first!');return;}
  if(scanning||tickers.length===0)return;
  scanning=true;results={};statuses={};updateScanBtn();
  document.getElementById('summary').style.display='none';
  document.getElementById('emptyState')?.remove();
  document.getElementById('results').innerHTML='';
  let spyQuote=null,spyMetric=null;
  try{const spy=await fetchAll('SPY');spyQuote=spy.quote;spyMetric=spy.metric;}catch(_){}
  for(const ticker of tickers){
    statuses[ticker]='scanning';renderChips();showSpinner(ticker);
    try{const r=await runProtocol(ticker,spyQuote,spyMetric);results[ticker]=r;statuses[ticker]='done';}
    catch(e){results[ticker]={ticker,error:e.message};statuses[ticker]='error';}
    renderChips();renderResults();
    await new Promise(r=>setTimeout(r,450));
  }
  scanning=false;updateScanBtn();updateSummary();
}
function showSpinner(ticker){
  const el=document.createElement('div');el.className='scan-card';el.id=`spin-${ticker}`;
  el.innerHTML=`<div class="spinner"></div><div><div class="scan-ticker-name">${ticker}</div><div class="scan-ticker-sub">Running 9-step protocol...</div></div>`;
  document.getElementById('results').appendChild(el);
}
function renderResults(){
  const area=document.getElementById('results');
  Object.keys(results).forEach(t=>{const s=document.getElementById(`spin-${t}`);if(s)s.remove();});
  const order={BUY:0,WAIT:1,'NO TRADE':2};
  const sorted=Object.values(results).sort((a,b)=>{const ao=order[a.action]??3,bo=order[b.action]??3;return ao!==bo?ao-bo:(b.conviction||0)-(a.conviction||0);});
  area.innerHTML='';
  sorted.forEach(r=>area.appendChild(buildCard(r)));
  tickers.filter(t=>statuses[t]==='scanning').forEach(t=>{if(!document.getElementById(`spin-${t}`))showSpinner(t);});
  updateSummary();
}
function buildCard(r){
  const div=document.createElement('div');
  if(r.error){div.className='card error-card';div.innerHTML=`<span style="color:var(--red);font-weight:700">⚠ ${r.ticker}</span><span style="font-size:10px;color:var(--text3)">${r.error}</span>`;return div;}
  const action=r.action||'NO TRADE';
  const cls=action==='BUY'?'buy':action==='WAIT'?'wait':'notrade';
  const badgeCls=action==='BUY'?'badge-buy':action==='WAIT'?'badge-wait':'badge-no';
  const icon=action==='BUY'?'🟢':action==='WAIT'?'🟡':'🔴';
  const tc=action==='BUY'?'var(--green)':action==='WAIT'?'var(--yellow)':'var(--red)';
  const rr=parseFloat(r.rr)||0;
  const rrCls=rr>=2?'rr-green':rr>=1.5?'rr-yellow':'rr-red';
  const stars=Array(5).fill(0).map((_,i)=>`<span class="star" style="color:${i<(r.conviction||0)?'#f5c842':'#1a2d4a'}">★</span>`).join('');
  const gateDots=[['regime','REGIME'],['sector','SECTOR'],['setup','SETUP'],['entry','ENTRY'],['risk','RISK']].map(([k,n])=>{const p=r.gates?.[k];const gc=p===true?'pass':p===false?'fail':'idle';return`<div class="gate-item"><div class="gate-dot ${gc}"></div><div class="gate-name">${n}</div></div>`;}).join('');
  const{stop,entry,price,target}=r;
  const vals=[stop,entry,price,target].filter(v=>v&&v>0);
  const mn=Math.min(...vals)*0.995,mx=Math.max(...vals)*1.005;
  const pct=v=>mn===mx?50:Math.max(0,Math.min(100,((v-mn)/(mx-mn))*100));
  const markers=[[stop,'var(--red)','STOP'],[entry,'var(--yellow)','ENTRY'],[price,'var(--cyan)','NOW'],[target,'var(--green)','TARGET']].map(([v,c,l])=>v?`<div class="price-marker" style="left:${pct(v)}%;background:${c}"></div>`:'').join('');
  const levels=[[stop,'var(--red)','STOP'],[entry,'var(--yellow)','ENTRY'],[price,'var(--cyan)','CURRENT'],[target,'var(--green)','TARGET']].map(([v,c,l])=>`<div class="level"><div class="level-lbl">${l}</div><div class="level-val" style="color:${c}">$${v?v.toFixed(2):'—'}</div></div>`).join('');
  const timingCls={'ENTER NOW':'t-enter','WAIT FOR PULLBACK':'t-pullback','WAIT FOR BREAKOUT':'t-breakout','AVOID TODAY':'t-avoid'}[r.timing]||'t-avoid';
  const warnings=(r.warnings||[]).map(w=>`<div class="warning">⚠ ${w}</div>`).join('');
  const meta=r.meta||{};
  const metaItems=[['VWAP~',meta.vwap?`$${meta.vwap}`:'—','var(--cyan)'],['ATR~',`$${meta.atr||'—'}`,'#a0c4ff'],['CHG%',`${(meta.changePct||0)>0?'+':''}${meta.changePct||0}%`,(meta.changePct||0)>0?'var(--green)':'var(--red)'],['BETA',meta.beta||'—',(meta.beta||1)>1.5?'var(--yellow)':'var(--text2)']].map(([l,v,c])=>`<div class="meta-item"><div class="meta-lbl">${l}</div><div class="meta-val" style="color:${c}">${v}</div></div>`).join('');
  div.className=`card ${cls}`;
  div.innerHTML=`<div class="card-head"><div class="card-ticker" style="color:${tc}">${r.ticker}</div><div class="card-badge ${badgeCls}">${icon} ${action}</div><div class="stars">${stars}</div><div class="rr-wrap"><div class="rr-label">R:R</div><div class="rr-val ${rrCls}">${rr.toFixed(2)}</div></div></div><div class="card-body"><div><div style="font-size:8px;color:var(--text3);letter-spacing:1px;margin-bottom:6px">GATE STATUS</div><div class="gates-row">${gateDots}</div></div><div class="meta-row">${metaItems}</div><div class="price-bar-wrap"><div class="price-bar-label">PRICE LEVELS · ${r.candle} · ${r.setup_type}</div><div class="price-track"><div class="price-fill" style="width:${pct(target)}%"></div>${markers}</div><div class="price-levels">${levels}</div></div><div class="advisor"><div class="advisor-head"><div class="advisor-title">TRADE ADVISOR</div><div class="timing ${timingCls}">${r.timing}</div></div><div class="advisor-text">${r.advice}</div>${warnings}</div><a class="chart-btn" href="https://www.tradingview.com/chart/?symbol=${r.ticker}&interval=D" target="_blank">📊 VERIFY ON TRADINGVIEW</a></div>`;
  return div;
}
function updateSummary(){
  const vals=Object.values(results).filter(r=>!r.error);
  if(!vals.length){document.getElementById('summary').style.display='none';return;}
  document.getElementById('summary').style.display='flex';
  document.getElementById('buyCount').textContent=vals.filter(r=>r.action==='BUY').length;
  document.getElementById('waitCount').textContent=vals.filter(r=>r.action==='WAIT').length;
  document.getElementById('noCount').textContent=vals.filter(r=>r.action==='NO TRADE').length;
}
renderChips();updateScanBtn();
</script>
</body>
